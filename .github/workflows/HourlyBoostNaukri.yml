name: Hourly Playwright Test Run

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: hourly-playwright
  cancel-in-progress: false

jobs:
  playwright-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: PlaywrightJavaProject

    env:
      USER_NAME: ${{ secrets.USER_NAME }}
      USER_PAS: ${{ secrets.USER_PAS }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: PlaywrightJavaProject/pom.xml

      - name: Install Playwright browser
        run: mvn exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"

      - name: Run Playwright tests 
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" mvn clean test -Dheadless=true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: PlaywrightJavaProject/target/surefire-reports/
