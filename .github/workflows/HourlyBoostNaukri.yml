name: Hourly Playwright Test Run

on:
  schedule:
    - cron: '*/15 * * * *'   
  workflow_dispatch:

concurrency:
  group: hourly-playwright
  cancel-in-progress: false

jobs:
  playwright-test:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30

    defaults:
      run:
        working-directory: PlaywrightJavaProject

    env:
      USER_NAME: ${{ secrets.USER_NAME }}
      USER_PAS: ${{ secrets.USER_PAS }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Playwright browser
        run: mvn exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install chromium"

      - name: Run Playwright tests (headed)
        run: mvn clean test -Dheadless=false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: PlaywrightJavaProject/target/surefire-reports/
